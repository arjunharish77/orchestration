# ──────────────────────────────────────────────────────────────────────
# Unnatify CRM — API Backend (NestJS)
# Place at: /etc/nginx/sites-available/api.unnatify.com
# Symlink:  ln -s /etc/nginx/sites-available/api.unnatify.com /etc/nginx/sites-enabled/
# ──────────────────────────────────────────────────────────────────────

upstream api_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.unnatify.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.unnatify.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/api.unnatify.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.unnatify.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "DENY"             always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header Referrer-Policy        "strict-origin"    always;
    add_header X-XSS-Protection       "0"                always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request size limit (file uploads)
    client_max_body_size 50m;

    # Proxy to NestJS backend
    location / {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health check — bypass caching/buffering
    location = /health {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_buffering    off;
        access_log         off;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }
}
