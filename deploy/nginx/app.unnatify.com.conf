# ──────────────────────────────────────────────────────────────────────
# Unnatify CRM — Frontend (Next.js)
# Place at: /etc/nginx/sites-available/app.unnatify.com
# Symlink:  ln -s /etc/nginx/sites-available/app.unnatify.com /etc/nginx/sites-enabled/
# ──────────────────────────────────────────────────────────────────────

upstream frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name app.unnatify.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.unnatify.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/app.unnatify.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.unnatify.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header Referrer-Policy        "strict-origin"    always;
    add_header X-XSS-Protection       "0"                always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request size limit
    client_max_body_size 20m;

    # Static assets — aggressive caching
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # All other routes — proxy to Next.js SSR
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }
}
